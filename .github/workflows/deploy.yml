name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, jacqui-website-work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "website/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: ./website

      - name: Build with Astro
        run: npm run build
        working-directory: ./website

      - name: Check the built site
        run: node --test tests/dist.test.mjs
        working-directory: ./website

      # The Pages project's production branch is main. Any other branch (a push to
      # jacqui-website-work, or a manual run from a feature branch) deploys as a
      # preview under its own branch alias and leaves production untouched.
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy website/dist --project-name=jacquichowles --branch="$DEPLOY_BRANCH" --commit-dirty=true
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
